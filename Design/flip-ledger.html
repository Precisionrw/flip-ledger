<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Flip Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* ---------- Tokens ---------- */
.th-dark{color-scheme:dark;--bg:#0B0D10;--side:#0F1215;--s1:#131619;--s2:#1B1F23;--s3:#24292E;--field:#1B1F23;--seg:#2A3036;--line:rgba(255,255,255,.08);--t1:#F2F4F6;--t2:#A1A8B1;--t3:#8A929C;--accent:#2B6FE3;--accent-hover:#3479EE;--accent-press:#2462CC;--accent-text:#7AAEFF;--route:#4A8CFF;--accent-tint:rgba(74,144,255,.14);--focus:rgba(74,144,255,.6);--pos:#3DB57F;--pos-tint:rgba(61,181,127,.14);--on-pos:#0B0D10;--neg:#F06A5F;--neg-solid:#C43D33;--neg-tint:rgba(240,106,95,.14);--warn:#E3A841;--warn-tint:rgba(227,168,65,.14);--st-viewing:#A592F7;--st-bought:#5EAEF0;--st-listed:#E3A841;--st-sold:#3DB57F;--st-passed:#8C939C;--c-purchase:#5B626C;--c-fees:#D97A5B;--c-ship:#CDA349;--c-gas:#8C80E0;--c-tolls:#CC6EA2;--c-extras:#4AA6A8;--c-profit:#3DB57F;--bar:#2E343B;--dot:#C9CFD6;--map:#131619;--card-shadow:none;--seg-shadow:0 1px 2px rgba(0,0,0,.4);--material:rgba(22,25,29,.76);--scrim:rgba(0,0,0,.5);--sheet-shadow:0 24px 64px rgba(0,0,0,.5);--toast-shadow:0 10px 30px rgba(0,0,0,.4)}
.th-light{color-scheme:light;--bg:#F4F3EF;--side:#ECEBE6;--s1:#FFFFFF;--s2:#F1F0EC;--s3:#E7E5E0;--field:#F1F0EC;--seg:#FFFFFF;--line:rgba(24,22,18,.08);--t1:#16171A;--t2:#4A4E55;--t3:#5F636A;--accent:#0A62D6;--accent-hover:#1A6EE0;--accent-press:#0855BB;--accent-text:#0A62D6;--route:#0A62D6;--accent-tint:rgba(10,98,214,.08);--focus:rgba(10,98,214,.45);--pos:#116B40;--pos-tint:rgba(17,107,64,.1);--on-pos:#FFFFFF;--neg:#B4332A;--neg-solid:#B4332A;--neg-tint:rgba(180,51,42,.09);--warn:#8F5A00;--warn-tint:rgba(214,150,30,.14);--st-viewing:#6A4BD6;--st-bought:#1A5E9E;--st-listed:#8F5A00;--st-sold:#116B40;--st-passed:#5C6168;--c-purchase:#B9BDC3;--c-fees:#D9653F;--c-ship:#C8962A;--c-gas:#7565D6;--c-tolls:#C2558F;--c-extras:#2E9496;--c-profit:#1F9A5E;--bar:#D9D7D1;--dot:#2E3237;--map:#FFFFFF;--card-shadow:0 1px 2px rgba(24,20,12,.04),0 0 0 1px rgba(24,20,12,.05);--seg-shadow:0 1px 2px rgba(24,20,12,.12),0 0 0 .5px rgba(24,20,12,.06);--material:rgba(250,249,246,.8);--scrim:rgba(24,20,12,.26);--sheet-shadow:0 24px 64px rgba(24,20,12,.18);--toast-shadow:0 10px 30px rgba(24,20,12,.14)}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t1)}
body{font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.mono{font-family:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;transition:background-color .2s cubic-bezier(.22,1,.36,1),transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s cubic-bezier(.22,1,.36,1)}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input::placeholder,textarea::placeholder{color:var(--t3)}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.h1{margin:0;font-size:48px;line-height:52px;font-weight:600;letter-spacing:-.03em}

/* ---------- Shell ---------- */
.shell{display:flex;min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;flex:0 0 232px;background:var(--side);box-shadow:inset -1px 0 0 var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 12px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.mark{width:28px;height:28px;border-radius:8px;background:var(--t1);display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 7px;flex:none}
.mark i{display:block;height:2px;border-radius:1px;background:var(--bg)}
.mark i:nth-child(2){width:70%}.mark i:nth-child(3){width:45%;background:var(--pos)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border-radius:12px;color:var(--t2);text-decoration:none;font-size:14px}
.nav a:hover{background:var(--s2);color:var(--t1)}
.nav a[aria-current="page"]{background:var(--s3);color:var(--t1);font-weight:500}
.nav .ct{margin-left:auto;font-size:12px;color:var(--t3);font-weight:400}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12px;color:var(--t2)}
.dot8{width:8px;height:8px;border-radius:4px;background:var(--pos);flex:none}
.main{flex:1;min-width:0;padding:48px 48px 64px;display:flex;flex-direction:column;gap:24px}
.tabbar{display:none}
@media (max-width:1023px) and (min-width:768px){
  .side{flex-basis:72px;padding:20px 12px}
  .brand span,.nav a span,.nav .ct,.side-foot span{display:none}
  .brand{padding:4px 10px}
  .nav a{justify-content:center;padding:0}
  .side-foot{justify-content:center;padding:8px 0}
  .main{padding:40px 32px 64px}
}
@media (max-width:767px){
  .side{display:none}
  .main{padding:calc(24px + env(safe-area-inset-top)) 16px calc(120px + env(safe-area-inset-bottom));gap:20px}
  .h1{font-size:32px;line-height:38px;letter-spacing:-.02em}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 4px env(safe-area-inset-bottom);background:var(--material);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 1px 0 var(--line)}
  .tabbar a{flex:1;min-height:49px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--t3);text-decoration:none;font-size:10px;font-weight:500}
  .tabbar a svg{width:24px;height:24px}
  .tabbar a[aria-current="page"]{color:var(--accent-text)}
  body.on-estimate .main{padding-bottom:calc(200px + env(safe-area-inset-bottom))}
}

/* ---------- Controls ---------- */
.btn{height:44px;padding:0 20px;border-radius:999px;font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn-pri{background:var(--accent);color:#fff}.btn-pri:hover{background:var(--accent-hover)}.btn-pri:active{background:var(--accent-press);transform:scale(.97)}
.btn-sec{background:var(--s2);color:var(--t1)}.btn-sec:hover{background:var(--s3)}.btn-sec:active{transform:scale(.97)}
.btn-plain{background:transparent;color:var(--t2)}.btn-plain:hover{background:var(--s2);color:var(--t1)}
.btn-del{background:var(--neg-tint);color:var(--neg)}.btn-del:hover{background:color-mix(in srgb,var(--neg) 22%,transparent)}
.btn-solid-del{background:var(--neg-solid);color:#fff}
.btn-sm{height:36px;padding:0 16px;font-size:13px}
.seg{display:flex;padding:2px;border-radius:999px;background:var(--s2);gap:2px}
.seg button{flex:1;height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--t2);white-space:nowrap}
.seg button:hover{color:var(--t1)}
.seg button[aria-pressed="true"]{background:var(--seg);box-shadow:var(--seg-shadow);color:var(--t1)}
.seg.big{padding:3px;max-width:440px}.seg.big button{height:36px}
.sw{width:51px;height:31px;border-radius:999px;padding:2px;display:flex;flex:none;background:var(--s3);justify-content:flex-start}
.sw span{width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:width .2s}
.sw:active span{width:33px}
.sw[aria-checked="true"]{background:var(--pos);justify-content:flex-end}
.chip{height:32px;padding:0 12px;border-radius:999px;background:var(--s2);color:var(--t1);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
.chip:hover{background:var(--s3)}.chip:active{transform:scale(.95)}
.chip .ct{color:var(--t3)}
.chip[aria-pressed="true"]{background:var(--t1);color:var(--bg)}
.chip[aria-pressed="true"] .ct{color:var(--bg);opacity:.64}
.chip.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--accent-text);padding:0 12px 0 8px;gap:4px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;flex:none}
.pill i{width:6px;height:6px;border-radius:3px;background:currentColor}
.st-viewing{color:var(--st-viewing);background:color-mix(in srgb,var(--st-viewing) 14%,transparent)}
.st-bought{color:var(--st-bought);background:color-mix(in srgb,var(--st-bought) 14%,transparent)}
.st-listed{color:var(--st-listed);background:color-mix(in srgb,var(--st-listed) 14%,transparent)}
.st-sold{color:var(--st-sold);background:color-mix(in srgb,var(--st-sold) 14%,transparent)}
.st-passed{color:var(--st-passed);background:color-mix(in srgb,var(--st-passed) 14%,transparent)}
.tag{height:28px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--t2);background:var(--s2);white-space:nowrap}
.tag b{color:var(--t1);font-weight:600}
.tone-pos{color:var(--pos)!important;background:var(--pos-tint)!important;font-weight:600}
.tone-warn{color:var(--warn)!important;background:var(--warn-tint)!important;font-weight:600}
.tone-neg{color:var(--neg)!important;background:var(--neg-tint)!important;font-weight:600}
.card{background:var(--s1);border-radius:20px;box-shadow:var(--card-shadow)}
.fld{height:36px;border-radius:999px;background:var(--field);display:flex;align-items:center;gap:8px;padding:0 12px}
.fld input,.fld select{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:13px;color:var(--t1);appearance:none;-webkit-appearance:none}
.fld:focus-within{box-shadow:0 0 0 2px var(--accent),0 0 0 5px var(--accent-tint)}
.fld input:focus-visible,.fld select:focus-visible{outline:none}

/* ---------- Grouped lists (iOS) ---------- */
.grp{display:flex;flex-direction:column;gap:8px}
.grp > h2,.grp > h3{margin:0;padding:0 16px;font-size:13px;font-weight:600;color:var(--t2)}
.grp > p{margin:0;padding:0 16px;font-size:12px;line-height:1.45;color:var(--t3)}
.list{background:var(--s1);border-radius:20px;box-shadow:var(--card-shadow);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:50px;padding:4px 16px;width:100%;text-align:left}
.row + .row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.row.li + .row::before,.row + .row.li::before{left:68px}
.row > label,.row > .lb{flex:none;font-size:15px;color:var(--t1)}
.row:focus-within{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.row:has(:focus-visible){box-shadow:inset 0 0 0 2px var(--focus)}
.val{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:4px;align-self:stretch}
.val input,.val select{flex:1;min-width:0;width:100%;min-height:42px;border:0;background:transparent;outline:none;font-size:15px;color:var(--t1);text-align:right;text-align-last:right;padding:0;appearance:none;-webkit-appearance:none}
.val input:focus-visible,.val select:focus-visible{outline:none}
.val input[type="date"]{flex:0 1 160px}
.u{font-size:15px;color:var(--t3);flex:none}
.add-row{color:var(--accent-text)}
.add-row:hover{background:var(--s2)}
textarea.note{display:block;width:100%;border:0;background:transparent;padding:12px 16px;font-size:15px;line-height:1.5;color:var(--t1);resize:vertical;outline:none;min-height:96px}
@media (max-width:767px){.row{min-height:52px}.row > label,.row > .lb,.val input,.val select,.u{font-size:17px}}

/* ---------- Estimate ---------- */
.est{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.est-form{flex:1 1 440px;max-width:600px;min-width:0;display:flex;flex-direction:column;gap:28px}
.est-result{flex:0 1 480px;min-width:380px;position:sticky;top:24px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px}
.res{padding:32px 32px 28px;display:flex;flex-direction:column;gap:28px}
.price{display:flex;align-items:flex-start;white-space:nowrap}
.price .d{font-size:112px;line-height:.86;font-weight:600;letter-spacing:-.055em}
.price .c{font-size:44px;line-height:1;font-weight:300;letter-spacing:-.02em;color:var(--t2);margin:6px 0 0 4px}
.cbar{display:flex;gap:2px;height:6px}
.cbar > i{display:block;border-radius:3px;min-width:3px;transition:flex-grow .4s cubic-bezier(.22,1,.36,1)}
.rc{display:grid;grid-template-columns:16px minmax(0,1fr) auto;align-items:baseline;padding:6px 0}
.rc .dt{width:6px;height:6px;border-radius:3px;align-self:start;margin-top:8px}
.rc .l,.rc .a{font-size:15px}
.rc .a{text-align:right}
.rc .f{grid-column:2/4;font-size:12px;line-height:1.4;color:var(--t3);margin-top:1px}
.rc.net .l,.rc.net .a{font-size:17px;font-weight:600}
.hr{height:1px;background:var(--line);margin:8px 0}
.cg{display:flex;flex-direction:column;gap:10px}
.cg-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px}
.cg-h b{font-weight:600;color:var(--t2)}.cg-h span{color:var(--t3);text-align:right}
.cg-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{text-align:left;padding:16px;border-radius:12px;background:var(--s2);display:flex;flex-direction:column;gap:3px;min-width:0;min-height:120px}
.opt:hover{background:var(--s3)}.opt:active{transform:scale(.98)}
.opt[aria-pressed="true"]{background:var(--accent-tint);box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--t2);margin-bottom:6px}
.opt[aria-pressed="true"] .top{color:var(--t1)}
.radio{width:20px;height:20px;border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--t3);flex:none}
[aria-pressed="true"] .radio{background:#fff;box-shadow:inset 0 0 0 6px var(--accent)}
.opt .v{font-size:24px;line-height:28px;font-weight:600;letter-spacing:-.02em}
.opt .s{font-size:12px;color:var(--t3)}
.opt .b{margin-top:auto;padding-top:8px;font-size:12px;font-weight:600;color:var(--pos)}
.maxbuy{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;border-radius:12px;background:var(--s2)}
.maxbuy input{width:56px;border:0;background:transparent;outline:none;font-size:15px;font-weight:600;color:var(--t1);padding:0;box-shadow:inset 0 -1px 0 var(--t3)}
.res-foot{display:flex;gap:8px;align-items:center;padding:16px 20px;background:var(--s2)}
.pbar{display:none}
@media (max-width:767px){
  .est-result{display:none}
  .est-form{max-width:none}
  .seg.big{max-width:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
  .chips::-webkit-scrollbar{display:none}
  .chips .chip{height:40px;padding:0 16px;font-size:15px;scroll-snap-align:start}
  body.on-estimate .pbar{display:flex;position:fixed;z-index:31;left:8px;right:8px;bottom:calc(57px + env(safe-area-inset-bottom));height:76px;border-radius:20px;background:var(--material);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 0 0 1px var(--line);flex-direction:column;align-items:stretch;padding:8px 16px 12px 20px;text-align:left;touch-action:none}
  .price .d{font-size:88px}.price .c{font-size:34px}
  .res{padding:8px 20px 24px}
}

/* ---------- Inventory ---------- */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.toolbar .filters{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 auto}
.banner{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 20px;border-radius:20px;background:var(--s2);font-size:14px;color:var(--t2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:16px}
.inv{background:var(--s1);border-radius:20px;box-shadow:var(--card-shadow);padding:24px;display:flex;flex-direction:column;gap:20px;text-align:left;min-width:0;width:100%}
.inv:hover{background:var(--s2)}.inv:active{transform:scale(.985)}
.inv .nm{font-size:20px;line-height:24px;font-weight:600;letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.inv .sb{font-size:13px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.prog i{display:block;height:4px;border-radius:2px;background:var(--s3)}
.fig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.fig span{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:12px;color:var(--t3)}
.fig b{font-size:17px;line-height:20px;font-weight:600;color:var(--t1);white-space:nowrap}
.inv .ft{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:24px;font-size:13px;color:var(--t2)}
.badge{height:24px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;font-size:12px;font-weight:600;white-space:nowrap;color:var(--t2);background:var(--s2)}
.tbl{background:var(--s1);border-radius:20px;box-shadow:var(--card-shadow);overflow-x:auto}
.tr{display:grid;grid-template-columns:minmax(240px,2.4fr) 110px 110px 130px 100px 120px 110px 90px;align-items:center;font-size:14px;min-width:1010px;text-decoration:none;color:var(--t1);width:100%;text-align:left}
.tr > *{padding:0 16px;white-space:nowrap;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tr > *:nth-child(-n+3){text-align:left}
.tr.th > *{font-size:12px;font-weight:500;color:var(--t3);height:44px;display:flex;align-items:center}
.tr.th > *:nth-child(n+4){justify-content:flex-end}
button.tr{min-height:48px;box-shadow:inset 0 1px 0 var(--line)}
button.tr:hover{background:var(--s2)}
.empty{padding:48px;display:flex;flex-direction:column;gap:16px;align-items:flex-start;max-width:880px}
.empty .ico{width:56px;height:56px;border-radius:12px;background:var(--s2);color:var(--t2);display:flex;align-items:center;justify-content:center}
.steps-row{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:24px}
.steps-row li{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--t2)}

/* ---------- Sheet ---------- */
.ov{position:fixed;inset:0;z-index:50}
.ov .scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .32s cubic-bezier(.22,1,.36,1)}
.sheet{position:absolute;top:12px;right:12px;bottom:12px;width:min(560px,calc(100% - 24px));background:var(--bg);border-radius:28px;box-shadow:var(--sheet-shadow),inset 0 0 0 1px var(--line);display:flex;flex-direction:column;overflow:hidden;animation:inR .32s cubic-bezier(.22,1,.36,1)}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 0 24px;min-height:56px}
.sheet-body{flex:1;overflow-y:auto;padding:8px 24px 32px;display:flex;flex-direction:column;gap:32px}

/* ================= Math ================= */
function fee(pay, amount, count) {
  const s = S.settings;
  if (!(amount > 0)) return 0;
  if (pay === 'paypal') return amount * n(s.paypalPct) / 100 + n(s.paypalFixed) * count;
  if (pay === 'ebay') return amount * n(s.ebayPct) / 100 + n(s.ebayFixed) * count;
  return 0;
}
function feeLabel(pay) { return pay === 'paypal' ? 'PayPal fees' : pay === 'ebay' ? 'eBay fees' : 'Fees'; }
function feeHint(pay) { const s = S.settings; return pay === 'paypal' ? `PayPal takes ${s.paypalPct}% + $${n(s.paypalFixed).toFixed(2)} of what the buyer pays.` : pay === 'ebay' ? `eBay takes ${s.ebayPct}% + $${n(s.ebayFixed).toFixed(2)} per order.` : 'No fees on cash. Meet somewhere public.'; }
/* d: draft or item. how: single | parts | whole. buy: price paid. */
function calc(d, how, avoid, buy) {
  const s = S.settings, trips = d.roundTrip ? 2 : 1;
  const mpg = n(d.mpg) || n(s.mpg), gp = d.gasPrice === '' || d.gasPrice == null ? n(s.gas) : n(d.gasPrice);
  const mi = (n(d.miles) + (avoid ? n(d.avoidMi) : 0)) * trips;
  const hrs = (n(d.hours) + (avoid ? n(d.avoidMin) / 60 : 0)) * trips;
  const gas = mpg > 0 ? mi / mpg * gp : 0;
  const tolls = avoid ? 0 : n(d.tollEach) * trips;
  let sales;
  if (how === 'parts') sales = (d.parts || []).map((p) => ({ price: n(p.sell), ship: n(p.ship) }));
  else if (how === 'whole') sales = [{ price: n(d.wholeSell), ship: n(d.wholeShip) }];
  else sales = [{ price: n(d.sell), ship: n(d.shipping) }];
  const count = sales.filter((x) => x.price > 0).length;
  const sale = sum(sales, (x) => x.price);
  const bship = how === 'parts' ? 0 : n(d.buyerShip);
  const rev = sale + bship;
  const fees = fee(d.pay, rev, Math.max(count, rev > 0 ? 1 : 0));
  const ship = sum(sales, (x) => x.ship);
  const extras = n(d.extras);
  const profit = rev - buy - fees - ship - gas - tolls - extras;
  const basis = buy + gas + tolls + extras;
  return { sale, bship, rev, fees, ship, buy, extras, count, profit, mi, hrs, gas, tolls, mpg, gp, trips,
    roi: basis > 0 ? profit / basis : 0, perHr: hrs > 0 ? profit / hrs : 0, margin: rev > 0 ? profit / rev : 0 };
}
function rating(r) {
  if (r.profit < 0 || r.margin < 0.08) return ['Not worth it', 'neg'];
  if (r.margin < 0.15) return ['Thin margin', 'warn'];
  return ['Strong deal', 'pos'];
}
const itemHow = (it) => it.kind === 'pc' ? 'parts' : 'single';
const itemCalc = (it, avoid) => calc(it, itemHow(it), avoid == null ? it.tolls === 'avoid' : avoid, n(it.buy));
function partShare(it, p) {
  const tot = sum(it.parts, (q) => n(q.sell)) || 1;
  const share = n(p.sell) / tot;
  const r = itemCalc(it);
  const c = n(it.buy) * share + (r.gas + r.tolls + r.extras) * share + fee(it.pay, n(p.sell), 1) + n(p.ship);
  return { share, cost: c, profit: n(p.sell) - c, purchase: n(it.buy) * share, gas: r.gas * share, tolls: r.tolls * share, extras: r.extras * share, fees: fee(it.pay, n(p.sell), 1), ship: n(p.ship) };
}
function statusOf(it) {
  if (it.dates.passed && it.status === 'passed') return 'passed';
  return it.status;
}
function syncPcStatus(it) {
  if (it.kind !== 'pc' || !it.parts.length) return;
  const sold = it.parts.filter((p) => p.sold);
  if (sold.length === it.parts.length) {
    it.status = 'sold'; it.dates.sold = sold.map((p) => p.sold).sort().pop();
    if (!it.dates.bought) it.dates.bought = it.dates.viewed || it.dates.sold;
    if (!it.dates.listed) it.dates.listed = it.dates.bought;
  } else if (it.status === 'sold') { it.status = 'listed'; delete it.dates.sold; }
  else if (sold.length && (it.status === 'viewing' || it.status === 'bought')) { it.status = 'listed'; if (!it.dates.bought) it.dates.bought = today(); if (!it.dates.listed) it.dates.listed = today(); }
}

/* ================= ZIP lookup (free, no key) ================= */
const zipWait = {};
function lookupZip(zip) {
  zip = String(zip || '').trim();
  if (!/^\d{5}$/.test(zip)) return Promise.resolve(null);
  if (S.zip[zip]) return Promise.resolve(S.zip[zip]);
  if (zipWait[zip]) return zipWait[zip];
  zipWait[zip] = fetch('https://api.zippopotam.us/us/' + zip).then((r) => r.ok ? r.json() : null).then((j) => {
    if (!j || !j.places || !j.places[0]) return null;
    const p = j.places[0];
    const v = { lat: +p.latitude, lng: +p.longitude, city: p['place name'], st: p['state abbreviation'] };
    S.zip[zip] = v; saveSoon(); return v;
  }).catch(() => null).finally(() => { delete zipWait[zip]; });
  return zipWait[zip];
}
function roadMiles(a, b) {
  const R = 3958.8, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h)) * 1.18;
}
async function milesBetween(z1, z2) {
  const [a, b] = await Promise.all([lookupZip(z1), lookupZip(z2)]);
  if (!a || !b) return null;
  const mi = Math.round(roadMiles(a, b));
  return { mi, hrs: Math.round(mi / 57 * 10) / 10, a, b };
}
function tierFor(mi) { const t = S.settings.tiers; return n(mi < 300 ? t[0] : mi < 800 ? t[1] : mi < 1500 ? t[2] : t[3]); }

  return `<h1 class="h1">Settings</h1>
  <div class="set-cols">
    <div style="flex:1 1 520px;max-width:760px">
      <section class="grp"><h2>Categories and quick picks</h2><div class="list">
        ${Object.keys(s.cats).map((c) => `<div class="row" style="flex-direction:column;align-items:stretch;gap:12px;padding:16px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><span style="font-size:15px;font-weight:500">${esc(c)} <span style="font-size:13px;font-weight:400;color:var(--t3)">${s.cats[c].length ? s.cats[c].length + ' quick picks' : 'No quick picks yet'}</span></span><button class="btn btn-plain btn-sm" data-act="rmCat" data-v="${esc(c)}" aria-label="Remove the ${esc(c)} category">Remove</button></div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">${s.cats[c].map((p) => `<span class="qp">${esc(p)}<button data-act="rmPick" data-c="${esc(c)}" data-v="${esc(p)}" aria-label="Remove ${esc(p)}">${ic('x', 14)}</button></span>`).join('')}
          <div class="fld" style="height:30px;width:180px"><input aria-label="Add a quick pick to ${esc(c)}" placeholder="Add to ${esc(c)}…" data-addpick="${esc(c)}"></div></div></div>`).join('')}
        <div class="row" style="gap:8px;padding:12px 16px"><div class="fld" style="flex:0 1 280px;border-radius:12px"><input aria-label="New category name" placeholder="Add a category, like Laptops" data-addcat="1"></div><button class="btn btn-sec btn-sm" data-act="addCat">Add category</button></div>
      </div><p>Quick picks show as one-tap chips on Estimate. Press Return to add one.</p></section>
    </div>
    <div style="flex:1 1 380px;max-width:520px">
      <section class="grp"><h2>You and your car</h2><div class="list">
        ${srow('Home ZIP', sf('set.homeZip', s.homeZip, { mode: 'numeric', max: 5, mono: true, label: 'Home ZIP' }))}
        ${srow('Fuel economy', sf('set.mpg', s.mpg, { suf: 'mpg', label: 'MPG' }))}
        ${srow('Gas price', sf('set.gas', s.gas, { pre: '$', suf: '/gal', w: 132, label: 'Gas price' }))}
        ${swRow('Count round trip by default', 'set.roundTrip', s.roundTrip)}
        ${srow('Default target profit', sf('set.target', s.target, { pre: '$', label: 'Default target profit' }))}
        ${srow('Warn when unsold after', sf('set.warnDays', s.warnDays, { suf: 'days', label: 'Days before warning' }))}
      </div><p>Your home ZIP measures every drive. Defaults apply to new estimates.</p></section>
      <section class="grp"><h2>Fees</h2><div class="list">
        ${srow('PayPal G&amp;S', `<div style="display:flex;align-items:center;gap:8px">${sf('set.paypalPct', s.paypalPct, { suf: '%', w: 92, label: 'PayPal percent' })}<span style="color:var(--t3)">+</span>${sf('set.paypalFixed', s.paypalFixed, { pre: '$', w: 84, label: 'PayPal fixed fee' })}</div>`)}
        ${srow('eBay', `<div style="display:flex;align-items:center;gap:8px">${sf('set.ebayPct', s.ebayPct, { suf: '%', w: 92, label: 'eBay percent' })}<span style="color:var(--t3)">+</span>${sf('set.ebayFixed', s.ebayFixed, { pre: '$', w: 84, label: 'eBay per-order fee' })}</div>`)}
        ${srow('Cash / local', '<span style="color:var(--t3)">No fees</span>')}
      </div><p>A parted-out PC pays the fee once per part sold.</p></section>
      <section class="grp"><h2>Shipping estimate by distance</h2><div class="list">
        ${['Under 300 mi', '300 to 800 mi', '800 to 1,500 mi', 'Over 1,500 mi'].map((l, i) => srow(l, sf('set.tiers.' + i, s.tiers[i], { pre: '$', w: 100, label: l }))).join('')}
      </div><p>Used when you enter a buyer ZIP. Distance is measured from your home ZIP.</p></section>
      <section class="grp"><h2>Appearance</h2><div class="list">${srow('Theme', `<div style="width:260px">${seg('set.theme', s.theme, [['system', 'System'], ['light', 'Light'], ['dark', 'Dark']])}</div>`)}</div></section>
      <section class="grp"><h2>Data</h2><div class="list">
        ${ex ? srow('Example items <span style="color:var(--t3)">' + S.items.filter((i) => i.example).length + '</span>', '<button class="btn btn-sec btn-sm" data-act="rmExamples">Remove examples</button>') : srow('Example items', '<button class="btn btn-sec btn-sm" data-act="loadExamples">Load examples</button>')}
        ${srow('Everything, as a spreadsheet', `<button class="btn btn-sec btn-sm" data-act="exportAll">${ic('export', 16)}Export CSV</button>`)}
        ${srow('Back up or move to another device', `<div style="display:flex;gap:8px"><button class="btn btn-sec btn-sm" data-act="backup">Back up</button><label class="btn btn-sec btn-sm" style="cursor:pointer">Restore<input type="file" accept="application/json" data-restore="1" class="sr"></label></div>`)}
        ${S.ui.setConfirm === 'reset' ? `<div class="row" role="alert"><span class="lb" style="color:var(--neg);font-weight:500">Erase every item and setting?</span><div class="val" style="align-self:center;gap:8px"><button class="btn btn-plain btn-sm" data-act="keepReset">Keep</button><button class="btn btn-solid-del btn-sm" data-act="reset">Erase</button></div></div>` : srow('Start over', '<button class="btn btn-del btn-sm" data-act="askReset">Erase everything</button>')}
      </div><p>Everything is saved in this browser on this device. Use Back up to keep a copy or move it to another device.</p></section>
    </div>
  </div>`;
}

/* ================= Data helpers ================= */
const curItem = () => S.items.find((i) => i.id === S.ui.sheet);
function rootOf(r) { return r === 'est' ? S.est : r === 'item' ? curItem() : r === 'set' ? S.settings : r === 'route' ? S.route : r === 'ui' ? S.ui : null; }
function setPath(path, val) {
  const parts = path.split('.'), obj0 = rootOf(parts.shift());
  if (!obj0) return;
  let o = obj0;
  for (let i = 0; i < parts.length - 1; i++) { if (o[parts[i]] == null) o[parts[i]] = {}; o = o[parts[i]]; }
  o[parts[parts.length - 1]] = val;
}
function getPath(path) { const parts = path.split('.'); let o = rootOf(parts.shift()); for (const k of parts) { if (o == null) return undefined; o = o[k]; } return o; }
function download(name, text, type) {
  const blob = new Blob([text], { type: type || 'text/plain' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const csvCell = (v) => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCSV = (rows) => rows.map((r) => r.map(csvCell).join(',')).join('\n');
function itemFromDraft(status) {
  const d = S.est, pc = d.mode === 'pc', t = today();
  const it = baseItem({ kind: pc ? 'pc' : 'single', status, name: pc ? (d.pcName || 'PC') : (d.item || 'Untitled'), brand: pc ? '' : d.brand, category: pc ? 'PC' : d.category,
    buy: pc ? d.pcBuy : d.buy, sell: d.sell, pay: d.pay, shipping: d.shipping, buyerShip: d.buyerShip, extras: d.extras, sellerZip: d.sellerZip, miles: d.miles, hours: d.hours,
    mpg: d.mpg, gasPrice: d.gasPrice, roundTrip: d.roundTrip, tolls: d.tolls, tollEach: d.tollEach, avoidMi: d.avoidMi, avoidMin: d.avoidMin,
    parts: pc ? d.parts.map((p) => Object.assign({}, p, { id: uid(), sold: '' })) : [], wholeSell: d.wholeSell, wholeShip: d.wholeShip, dates: { viewed: t } });
  if (status === 'bought') it.dates.bought = t;
  return it;
}
function restatus(it) {
  if (it.status === 'passed') return;
  let st = 'viewing';
  STATUSES.forEach((k) => { if (it.dates[DK[k]]) st = k; });
  if (it.kind === 'pc') { if (st === 'sold' && it.parts.some((p) => !p.sold)) st = 'listed'; }
  it.status = st;
}

/* ================= Actions ================= */
function act(name, el) {
  const v = el.dataset.v, f = el.dataset.f;
  const it = curItem();
  switch (name) {
    case 'set': {
      const val = v === 'true' ? true : v === 'false' ? false : v;
      setPath(f, val);
      if (f === 'set.theme') applyTheme();
      if (f.indexOf('item.') === 0) { render(); }
      else if (f.indexOf('route.') === 0) { render(); }
      else render();
      saveSoon(); break;
    }
    case 'toggle': setPath(f, !getPath(f)); render(); saveSoon(); break;
    case 'pick': { S.est.item = v; const inp = $('#f-est-item'); if (inp) inp.value = v; refreshEst(); saveSoon(); break; }
    case 'savePick': { const c = S.est.category, x = S.est.item.trim(); if (!x) break; S.settings.cats[c] = (S.settings.cats[c] || []).concat([x]); refreshEst(); toast(x + ' added to ' + c + ' quick picks'); saveSoon(); break; }
    case 'addPart': { const t = el.dataset.t, target = t === 'est' ? S.est : it; target.parts.push({ id: uid(), cat: 'GPU', model: '', sell: '', ship: '', sold: '' }); render(); const ins = document.querySelectorAll(`[data-f^="${t}.parts.${target.parts.length - 1}.model"]`); if (ins[0]) ins[0].focus(); saveSoon(); break; }
    case 'rmPart': { const t = el.dataset.t, target = t === 'est' ? S.est : it; target.parts.splice(+el.dataset.i, 1); if (t === 'item') syncPcStatus(it); render(); saveSoon(); break; }
    case 'partSold': { const p = it.parts[+el.dataset.i]; p.sold = p.sold ? '' : today(); syncPcStatus(it); render(); if (p.sold) toast((p.model || 'Part') + ' marked sold'); saveSoon(); break; }
    case 'saveEst': {
      const { r } = estCalc();
      if (r.rev === 0 && r.buy === 0) { toast('Add a buy and sell price first'); break; }
      const nItem = itemFromDraft(v); S.items.unshift(nItem); saveSoon(); renderNav();
      toast(nItem.name + ' saved to ' + ST_LABEL[v]); break;
    }
    case 'clearEst': S.est = blankDraft(S.settings); S.ui.lastProfit = null; S.ui.zipMsg = ''; S.ui.shipMsg = ''; render(); toast('Cleared'); saveSoon(); break;
    case 'example': S.est = Object.assign(exampleDraft(S.settings), { mode: S.est.mode }); render(); saveSoon(); break;
    case 'openResult': S.ui.resultOpen = true; renderOverlay(); break;
    case 'closeResult': S.ui.resultOpen = false; renderOverlay(); break;
    case 'filter': S.ui.filter = v; render(); break;
    case 'open': S.ui.sheet = el.dataset.id; S.ui.confirm = false; renderOverlay(); setTimeout(() => { const d = $('.sheet .sheet-top button'); if (d) d.focus(); }, 50); break;
    case 'closeSheet': S.ui.sheet = null; S.ui.confirm = false; render(); if (v === 'save') toast('Saved'); saveSoon(); break;
    case 'stamp': {
      const idx = STATUSES.indexOf(v), t = today();
      if (it.kind === 'pc' && v === 'sold') { it.parts.forEach((p) => { if (!p.sold) p.sold = t; }); syncPcStatus(it); }
      STATUSES.slice(0, idx + 1).forEach((k) => { if (!it.dates[DK[k]]) it.dates[DK[k]] = t; });
      delete it.dates.passed; it.status = v; if (it.kind === 'pc') syncPcStatus(it);
      render(); toast(it.name + ' marked ' + ST_LABEL[it.status]); saveSoon(); break;
    }
    case 'pass': it.status = 'passed'; it.dates.passed = today(); render(); toast(it.name + ' marked passed'); saveSoon(); break;
    case 'askDelete': S.ui.confirm = true; renderOverlay(); break;
    case 'keep': S.ui.confirm = false; renderOverlay(); break;
    case 'delete': { const nm = it.name; S.items = S.items.filter((i) => i.id !== it.id); S.ui.sheet = null; S.ui.confirm = false; render(); toast(nm + ' deleted'); saveSoon(); break; }
    case 'check': it.checks[el.dataset.i] = !it.checks[el.dataset.i]; renderOverlay(); saveSoon(); break;
    case 'month': if (v) { S.ui.month = v; render(); } break;
    case 'routeTo': S.route.to = v; render(); saveSoon(); break;
    case 'useRoute': {
      const d = routeData(); if (!d.ok) { toast('Add both ZIPs first'); break; }
      Object.assign(S.est, { sellerZip: S.route.to, miles: String(d.take.mi), hours: d.take.hrs.toFixed(1), tollEach: S.route.tollEach, avoidMi: S.route.avoidMi, avoidMin: S.route.avoidMin, tolls: d.avoid ? 'avoid' : 'take' });
      saveSoon(); location.hash = '#estimate'; setTimeout(() => toast('Route added to the estimate'), 50); break;
    }
    case 'rmCat': delete S.settings.cats[v]; render(); saveSoon(); break;
    case 'rmPick': S.settings.cats[el.dataset.c] = S.settings.cats[el.dataset.c].filter((x) => x !== v); render(); saveSoon(); break;
    case 'addCat': { const inp = $('[data-addcat]'); addCategory(inp && inp.value); break; }
    case 'rmExamples': { const k = S.items.filter((i) => i.example).length; S.items = S.items.filter((i) => !i.example); render(); toast(k + ' examples removed'); saveSoon(); break; }
    case 'loadExamples': S.items = S.items.concat(seedExamples()); render(); toast('Examples loaded'); saveSoon(); break;
    case 'exportAll': {
      const rows = [['Name', 'Brand', 'Category', 'Kind', 'Status', 'Viewed', 'Bought', 'Listed', 'Sold', 'Paid', 'Sell / sold for', 'Fees', 'Shipping', 'Gas', 'Tolls', 'Extras', 'Profit', 'Paid with', 'Seller ZIP', 'Miles one way', 'Notes']];
      S.items.forEach((i) => { const r = itemCalc(i); rows.push([i.name, i.brand, i.category, i.kind, statusOf(i), i.dates.viewed, i.dates.bought, i.dates.listed, i.dates.sold, n(i.buy), r.rev.toFixed(2), r.fees.toFixed(2), r.ship.toFixed(2), r.gas.toFixed(2), r.tolls.toFixed(2), r.extras.toFixed(2), r.profit.toFixed(2), i.pay, i.sellerZip, i.miles, i.notes]); });
      download('flip-ledger-' + today() + '.csv', toCSV(rows), 'text/csv'); break;
    }
    case 'exportMonth': {
      const m = monthStats(v), rows = [['Item', 'Status', 'Viewed', 'Bought', 'Sold', 'Days', 'Paid', 'Sold for', 'Costs', 'Profit']];
      m.rows.forEach((r) => rows.push([r.name + (r.brand ? ' ' + r.brand : ''), ST_LABEL[r.st], r.viewed, r.bought, r.sold, r.days, r.paid, r.soldFor, r.costs, r.profit]));
      rows.push([]); rows.push(['Net profit', m.profit.toFixed(2)]); rows.push(['Revenue', m.revenue.toFixed(2)]); rows.push(['Sales', m.sales]);
      download('flip-ledger-' + v + '.csv', toCSV(rows), 'text/csv'); break;
    }
    case 'backup': download('flip-ledger-backup-' + today() + '.json', JSON.stringify({ settings: S.settings, items: S.items, est: S.est, route: S.route }, null, 2), 'application/json'); break;
    case 'askReset': S.ui.setConfirm = 'reset'; render(); break;
    case 'keepReset': S.ui.setConfirm = ''; render(); break;
    case 'reset': try { localStorage.removeItem(KEY); } catch (e) {} S.settings = DEFAULT_SETTINGS(); S.items = []; S.est = blankDraft(S.settings); S.ui.setConfirm = ''; applyTheme(); render(); toast('Everything erased'); saveSoon(); break;
  }
}
function addCategory(name) {
  name = String(name || '').trim(); if (!name) return;
  if (!S.settings.cats[name]) S.settings.cats[name] = [];
  render(); toast(name + ' added'); saveSoon();
}

/* ================= Field input ================= */
function handleField(el) {
  const path = el.dataset.f, val = el.type === 'checkbox' ? el.checked : el.value, root = path.split('.')[0];
  setPath(path, val);
  const home = S.settings.homeZip;
  if (root === 'est') {
    const k = path.slice(4);
    if (k === 'sellerZip') {
      S.ui.zipMsg = '';
      if (/^\d{5}$/.test(val)) {
        if (!/^\d{5}$/.test(home)) S.ui.zipMsg = 'Add your home ZIP in Settings to fill miles.';
        else milesBetween(home, val).then((res) => {
          if (S.est.sellerZip !== val) return;
          if (res) { S.est.miles = String(res.mi); S.est.hours = String(res.hrs); const a = $('#f-est-miles'), b = $('#f-est-hours'); if (a) a.value = S.est.miles; if (b) b.value = S.est.hours; S.ui.zipMsg = `Filled from ${res.b.city}, ${res.b.st}.`; }
          else S.ui.zipMsg = "Couldn't look up that ZIP. Enter the miles by hand.";
          refreshEst(); saveSoon();
        });
      }
    }
    if (k === 'buyerZip') {
      S.ui.shipMsg = '';
      if (/^\d{5}$/.test(val) && /^\d{5}$/.test(home) && S.est.mode !== 'pc') milesBetween(home, val).then((res) => {
        if (!res || S.est.buyerZip !== val) return;
        S.est.shipping = String(tierFor(res.mi)); const s = $('#f-est-shipping'); if (s) s.value = S.est.shipping;
        S.ui.shipMsg = `About ${res.mi} mi to ${res.b.city}, so shipping is set to $${S.est.shipping}. `; refreshEst(); saveSoon();
      });
    }
    if (el.tagName === 'SELECT' && k !== 'category') render(); else refreshEst();
  } else if (root === 'item') {
    const it = curItem(); if (!it) return;
    if (path.indexOf('item.dates.') === 0) { if (!val) delete it.dates[path.split('.')[2]]; restatus(it); render(); }
    else if (el.tagName === 'SELECT') { render(); }
    else {
      refreshSheet(); $('#main').innerHTML = ({ estimate: viewEstimate, inventory: viewInventory, route: viewRoute, monthly: viewMonthly, settings: viewSettings })[S.ui.screen]();
      if (path === 'item.sellerZip' && /^\d{5}$/.test(val) && /^\d{5}$/.test(home)) milesBetween(home, val).then((res) => {
        if (!res || it.sellerZip !== val) return; it.miles = String(res.mi); it.hours = String(res.hrs);
        const a = $('#f-item-miles'), b = $('#f-item-hours'); if (a) a.value = it.miles; if (b) b.value = it.hours; refreshSheet(); saveSoon();
      });
    }
  } else if (root === 'set') {
    if (path === 'set.homeZip' && /^\d{5}$/.test(val)) lookupZip(val).then(() => { if (S.ui.screen === 'route') refreshRoute(); });
    if (S.ui.screen === 'route') refreshRoute();
  } else if (root === 'route') {
    if (path === 'route.to' && /^\d{5}$/.test(val)) lookupZip(val).then(() => refreshRoute());
    refreshRoute();
  } else if (root === 'ui') {
    const box = $('#invItems'); if (box) box.innerHTML = invItemsHTML(filteredItems());
  }
  saveSoon();
}

/* ================= Wiring ================= */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  if (t.tagName === 'A') return;
  e.preventDefault();
  act(t.dataset.act, t);
});
document.addEventListener('input', (e) => { const el = e.target; if (el.dataset && el.dataset.f && el.tagName !== 'SELECT') handleField(el); });
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.restore) {
    const file = el.files && el.files[0]; if (!file) return;
    file.text().then((txt) => {
      try { const d = JSON.parse(txt); if (!Array.isArray(d.items)) throw new Error('bad'); S.items = d.items; S.settings = Object.assign(DEFAULT_SETTINGS(), d.settings); if (d.est) S.est = Object.assign(blankDraft(S.settings), d.est); if (d.route) S.route = Object.assign(S.route, d.route); applyTheme(); render(); toast('Backup restored'); saveSoon(); }
      catch (err) { toast("That file isn't a Flip Ledger backup"); }
    });
    return;
  }
  if (el.dataset && el.dataset.f && el.tagName === 'SELECT') handleField(el);
});
document.addEventListener('keydown', (e) => {
  const el = e.target;
  if (e.key === 'Enter' && el.dataset) {
    if (el.dataset.addpick) { const c = el.dataset.addpick, v = el.value.trim(); if (v && S.settings.cats[c].indexOf(v) < 0) { S.settings.cats[c].push(v); render(); saveSoon(); const nx = document.querySelector(`[data-addpick="${CSS.escape(c)}"]`); if (nx) nx.focus(); } return; }
    if (el.dataset.addcat) { addCategory(el.value); return; }
  }
  if (e.key === 'Escape') {
    if (S.ui.sheet) { S.ui.sheet = null; S.ui.confirm = false; render(); }
    else if (S.ui.resultOpen) { S.ui.resultOpen = false; renderOverlay(); }
  }
});
let dragY = null, dragEl = null;
document.addEventListener('pointerdown', (e) => { const t = e.target.closest('#pbar,[data-drag]'); if (t) { dragY = e.clientY; dragEl = t; } });
document.addEventListener('pointerup', (e) => {
  if (dragY == null) return;
  const dy = e.clientY - dragY, t = dragEl; dragY = null; dragEl = null;
  if (t.id === 'pbar' && dy < -16) { S.ui.resultOpen = true; renderOverlay(); }
  else if (t.dataset.drag === 'close' && dy > 40) { S.ui.resultOpen = false; renderOverlay(); }
  else if (t.dataset.drag === 'closeSheet' && dy > 40) { S.ui.sheet = null; render(); }
});
function route() {
  const h = (location.hash || '#estimate').slice(1);
  S.ui.screen = SCREENS.some(([k]) => k === h) ? h : 'estimate';
  S.ui.resultOpen = false; S.ui.lastProfit = null;
  render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
let rz = 0;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.ui.screen === 'route') drawMap(); if (!narrow() && S.ui.resultOpen) { S.ui.resultOpen = false; renderOverlay(); } }, 120); });

/* ================= Start ================= */
loadState();
applyTheme();
route();
[S.settings.homeZip, S.route.to].forEach((z) => { if (/^\d{5}$/.test(z) && !S.zip[z]) lookupZip(z).then(() => { if (S.ui.screen === 'route') refreshRoute(); }); });
</script>
